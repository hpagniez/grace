[package]
name = "grace-tauri-spike"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-shell = { version = "=2.6.0", optional = true }

[features]
# Option 3 probe: the shell plugin, granted to the page by tauri.plugins.conf.json.
plugins = ["dep:tauri-plugin-shell"]

# Size-first release build, as Tauri's app size guide suggests.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
