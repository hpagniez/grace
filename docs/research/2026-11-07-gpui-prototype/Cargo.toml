[package]
name = "grace-gpui"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["x11"] }
futures = "0.3"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
