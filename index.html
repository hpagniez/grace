<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:*"
    />
    <title>Grace</title>
    <style>
      /* Shown until the app is drawn; App removes it. Colours are the ground and ink tokens of src/index.css (GROUND in src/shared/theme.ts). */
      #startup {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #f3efe6;
        color: #151821;
        font:
          14px "IBM Plex Sans Variable",
          "Segoe UI Variable",
          system-ui,
          sans-serif;
      }
      #startup svg {
        width: 48px;
        height: 48px;
      }
      #startup .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #startup {
          background: #151821;
          color: #f1efe9;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup" role="status" aria-label="Loading Grace">
      <!-- assets/icon.svg, inlined; its ids are prefixed so they stay unique on the page -->
      <svg viewBox="0 0 256 256" aria-hidden="true">
        <defs>
          <clipPath id="startup-above"><polygon points="316,-69 -62,338 -62,-69" /></clipPath>
          <clipPath id="startup-below"><polygon points="316,-69 -62,338 316,338" /></clipPath>
          <g id="startup-moth">
            <g fill="#ece6d8">
              <path d="M124 104 C100 92 64 80 40 84 C40 112 56 134 80 142 L124 134 Z" />
              <path d="M124 136 L82 146 C80 166 94 182 112 186 L126 156 Z" />
              <path d="M132 104 C156 92 192 80 216 84 C216 112 200 134 176 142 L132 134 Z" />
              <path d="M132 136 L174 146 C176 166 162 182 144 186 L130 156 Z" />
              <ellipse cx="128" cy="138" rx="12" ry="44" />
              <circle cx="128" cy="92" r="12" />
              <ellipse cx="106" cy="68" rx="20" ry="6" transform="rotate(38 106 68)" />
              <ellipse cx="150" cy="68" rx="20" ry="6" transform="rotate(-38 150 68)" />
            </g>
            <g fill="#c9bfa8">
              <circle cx="76" cy="106" r="8" />
              <circle cx="180" cy="106" r="8" />
            </g>
          </g>
        </defs>
        <rect x="8" y="8" width="240" height="240" rx="52" fill="#151821" />
        <g clip-path="url(#startup-above)">
          <use href="#startup-moth" transform="translate(-4 -4)" />
        </g>
        <g clip-path="url(#startup-below)">
          <use href="#startup-moth" transform="translate(4 4)" />
        </g>
        <polygon points="212,48 208,44 39.4,215.9 52.6,228.1" fill="#3fcf6e" />
        <circle cx="46" cy="222" r="9" fill="#3fcf6e" />
      </svg>
      Grace
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
