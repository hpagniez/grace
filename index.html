<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:*"
    />
    <title>Grace</title>
    <style>
      /* Shown until the app is drawn; App removes it. Colours match the app root's backgrounds. */
      #startup {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #ffffff;
        color: #18181b;
        font:
          14px system-ui,
          sans-serif;
      }
      #startup .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #startup {
          background: #18181b;
          color: #f4f4f5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup .spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="startup" role="status" aria-label="Loading Grace">
      Grace
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/renderer.tsx"></script>
  </body>
</html>
