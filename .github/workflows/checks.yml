# Fast checks on Linux for every PR (ADR 0007). Windows tests are in test.yml. By hand on a branch, as if it were a PR
# into develop: cargo-updates starts it on its bump PR, which GITHUB_TOKEN opened and so started no workflow (ADR 0033).
name: checks

on:
  pull_request:
    branches: [develop, main]
    # ready_for_review: a bump PR opened by vendor-updates starts CI only when a person marks it ready
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # a release/* or hotfix/* merge back into develop runs nothing: its PR into main checked the same commit (ADR 0017)
    if: ${{ !(github.base_ref == 'develop' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: ci
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # each check runs even if an earlier one failed, so one run reports them all
      - run: npm run lint
        if: ${{ !cancelled() && steps.ci.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.ci.outcome == 'success' }}
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() && steps.ci.outcome == 'success' }}
      # GPUI Grace's Rust format (ADR 0031); clippy needs a full build, so it runs in test.yml
      - run: rustup show active-toolchain || rustup toolchain install
        if: ${{ !cancelled() }}
      - run: cargo fmt --all --check
        if: ${{ !cancelled() }}
      # The agent rules files stay within their limits (docs/specs/2026-11-12-way-of-working.md)
      - run: cargo xtask check-rules
        if: ${{ !cancelled() }}
      - run: node scripts/check-pr.mjs
        if: ${{ !cancelled() && steps.ci.outcome == 'success' }}
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || 'develop' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/develop' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
