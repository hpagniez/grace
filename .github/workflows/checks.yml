# Fast checks on Linux for every PR (ADR 0007). Windows tests are in test.yml.
name: checks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - id: ci
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      # each check runs even if an earlier one failed, so one run reports them all
      - run: npm run lint
        if: ${{ !cancelled() && steps.ci.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.ci.outcome == 'success' }}
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() && steps.ci.outcome == 'success' }}
      - run: node scripts/check-pr.mjs
        if: ${{ !cancelled() && steps.ci.outcome == 'success' }}
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
