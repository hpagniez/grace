# Windows unit and e2e tests (ADR 0007). Drafts run unit tests only; e2e runs once the PR is ready for review.
name: test

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # the unpacked JRE and jar only; fetch-vendor.mjs re-verifies the jar
          path: |
            vendor
            !vendor/.download
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-vendor.mjs') }}
      - run: npm ci
      - run: npm run vendor
      # one job runs both suites in turn: their Java leak checks must not overlap (AGENTS.md)
      - run: npm test
      - run: npm run e2e
        if: ${{ !github.event.pull_request.draft }}
