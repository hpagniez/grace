# Windows unit and e2e tests (ADR 0007, ADR 0016, ADR 0017). Each job runs on its own VM, so the suites' Java leak
# checks never see each other's processes. Unit tests run on every PR; e2e only on PRs into main once ready for
# review, and on manual runs. A release/* or hotfix/* merge back into develop runs nothing: its PR into main did.
name: test

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    if: ${{ !(github.base_ref == 'develop' && (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))) }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        half: [1, 2]
    env:
      # half 2 runs these runner files (about 225 s of tests on CI), half 1 every other test file (about 225 s),
      # each on 3 workers. Not vitest --shard: it splits by file count. Move files between the halves to keep
      # them even.
      SECOND_HALF: >-
        src/main/runner.discovery.test.ts
        src/main/runner.runs.test.ts
        src/main/runner.tags.test.ts
        src/main/runner.rerun.test.ts
        src/main/runner.properties.test.ts
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # the unpacked JRE and jar only; fetch-vendor.mjs re-verifies the jar
          path: |
            vendor
            !vendor/.download
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-vendor.mjs', 'scripts/vendor.json') }}
      - run: npm ci
      - run: npm run vendor
      # UNIT_EXCLUDE is read by vitest.config.mts
      - name: npm test
        run: |
          if [ ${{ matrix.half }} = 1 ]; then UNIT_EXCLUDE="$SECOND_HALF" npm test; else npm test -- $SECOND_HALF; fi

  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.base_ref == 'main' }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # Playwright shards whole files by test count, in name order
        shard: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # the unpacked JRE and jar only; fetch-vendor.mjs re-verifies the jar
          path: |
            vendor
            !vendor/.download
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-vendor.mjs', 'scripts/vendor.json') }}
      - run: npm ci
      - run: npm run vendor
      # the event's draft flag is stale when a push and "ready for review" land together; ask GitHub now
      - id: pr
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "draft=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .draft)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      # merge-when-green.yml merges a back-merge into develop only if every step with this name passed
      - name: e2e
        run: npm run e2e -- --shard=${{ matrix.shard }}/2
        if: ${{ steps.pr.outputs.draft != 'true' }}
