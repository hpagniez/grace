# Merges a labelled PR into develop once checks, test and perf are green on its head (ADR 0011, ADR 0017, ADR 0023).
# workflow_run and pull_request_target always run this file as it is on develop.
name: merge-when-green

on:
  workflow_run:
    workflows: [checks, test, perf]
    types: [completed]
  # a label added, or a draft marked ready, after CI finished
  pull_request_target:
    branches: [develop]
    types: [labeled, ready_for_review]

permissions:
  actions: read
  contents: write
  issues: write # closes the issues a merged PR names with Closes #N
  pull-requests: write

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'pull_request'
        && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'pull_request_target'
        && contains(github.event.pull_request.labels.*.name, 'merge-when-green'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # one run per PR at a time, so a run that starts after a merge sees the PR merged
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
    # no checkout: the job holds a write token and needs only the API
    steps:
      - run: |
          skip() { echo "::notice::not merging #$PR: $1"; exit 0; }
          [ -n "$PR" ] || skip "no PR in this event"
          pr=$(gh api "repos/$GH_REPO/pulls/$PR" \
            --jq '"\(.state) \(.draft) \(.base.ref) \(any(.labels[]; .name == "merge-when-green")) \(.head.repo.full_name != .base.repo.full_name) \(.head.sha) \(.head.ref)"')
          read -r state draft base labelled fork sha head <<<"$pr"
          [ "$state" = open ] || skip "it is not open"
          [ "$draft" = false ] || skip "it is a draft"
          [ "$base" = develop ] || skip "it does not target develop"
          [ "$labelled" = true ] || skip "it has no merge-when-green label"
          # the label stays when new commits come in, and a fork's author can push, then mark the PR ready (ADR 0018)
          [ "$fork" = false ] || skip "it comes from a fork"

          # a release/* or hotfix/* merge back into develop runs no CI of its own (its runs are skipped):
          # the same head must have passed checks, test (e2e included) and perf on its PR into main
          back=false only=""
          case $head in release/* | hotfix/*) back=true only="&status=success" ;; esac

          # newest pull_request run of a workflow on the PR head ("null null" if none); a re-run updates it in place
          latest() {
            gh api "repos/$GH_REPO/actions/workflows/$1/runs?event=pull_request&head_sha=$sha&per_page=1$only" \
              --jq '.workflow_runs[0] | "\(.id) \(.conclusion)"'
          }
          run=$(latest checks.yml)
          read -r id conclusion <<<"$run"
          [ "$conclusion" = success ] || skip "checks is not green on $sha"
          run=$(latest test.yml)
          read -r id conclusion <<<"$run"
          if [ "$id" = null ]; then
            # test.yml's paths-ignore skips a PR that changes only docs/** and *.md
            files=$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[].filename')
            while read -r f; do
              [[ $f == docs/* || $f == *.md ]] || skip "test has not run on $sha"
            done <<<"$files"
          else
            [ "$conclusion" = success ] || skip "test is not green on $sha"
            if [ "$back" = true ]; then
              # every e2e shard must pass; a run started while the PR into main was a draft skipped them
              e2e=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs" --jq '[.jobs[].steps[] | select(.name == "e2e") | .conclusion] | length > 0 and all(. == "success")')
              [ "$e2e" = true ] || skip "e2e has not passed on $sha"
            fi
          fi
          run=$(latest perf.yml)
          read -r id conclusion <<<"$run"
          if [ "$id" = null ]; then
            # perf.yml has the same paths-ignore as test.yml
            files=$(gh api "repos/$GH_REPO/pulls/$PR/files" --paginate --jq '.[].filename')
            while read -r f; do
              [[ $f == docs/* || $f == *.md ]] || skip "perf has not posted numbers on $sha"
            done <<<"$files"
          else
            # a worse number never fails perf: success only means the numbers were posted
            [ "$conclusion" = success ] || skip "perf has not posted numbers on $sha"
          fi

          # --match-head-commit refuses the merge if a push landed after these checks
          gh pr merge "$PR" --merge --delete-branch --match-head-commit "$sha"

          # GitHub ignores closing keywords (Closes #N) in a merge made with the workflow token: close them here
          issues=$(gh pr view "$PR" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[] | select("\(.repository.owner.login)/\(.repository.name)" == env.GH_REPO) | .number')
          for n in $issues; do
            [ "$(gh issue view "$n" --json state --jq .state)" = OPEN ] || continue
            gh issue close "$n" --reason completed --comment "Done in #$PR."
          done
