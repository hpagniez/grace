# Weekly draft PR that moves GPUI Grace to the newest gpui-pre, GPUI Kit and Rust, and Cargo.lock to the newest
# releases its requirements allow, with the Windows patches rebased (ADR 0032, scripts/bump-cargo.mjs). It then starts
# test.yml on the branch, so the new releases are built and tested with the patches on Linux and Windows. A patch that
# no longer applies gets an issue, and the rest still moves.
name: cargo-updates

on:
  # Tuesday: gpui-pre comes out early on Monday (UTC) and GPUI Kit later that day
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

# a run is never cut off between its push and its PR
concurrency:
  group: cargo-updates
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Cargo only resolves the lock here: no build script or code of the new releases runs with this token
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # starts test.yml on the bump branch: a PR opened with GITHUB_TOKEN starts no workflow, a dispatch does
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/bump-cargo.mjs --pr
        env:
          GH_TOKEN: ${{ github.token }}
