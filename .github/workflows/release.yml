# Builds the Windows zip for a version tag, has SignPath sign Grace.exe, and attaches the zip to a GitHub Release (ADRs 0007, 0024).
# No tests here: the release or hotfix PR into main ran them.
# Every release is a release candidate until a stable release is decided (ADR 0015): a plain vX.Y.Z tag builds nothing.
# By hand: build and sign with SignPath's test certificate, publish nothing.
name: release

on:
  push:
    tags: ["v*.*.*-rc.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            !vendor/.download
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-vendor.mjs', 'scripts/vendor.json') }}
      - run: npm ci
      - run: npm run vendor
      - run: npm run make
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: unsigned
          path: out/make/zip/win32/x64/*.zip
          if-no-files-found: error

  # Skipped until SignPath Foundation accepts the project and the repository has its variable and secret.
  # A job of its own, so SignPath's action never holds the token that can publish.
  sign:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    steps:
      - uses: SignPath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: grace
          signing-policy-slug: ${{ github.event_name == 'push' && 'release-signing' || 'test-signing' }}
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          parameters: |
            version: "${{ needs.build.outputs.version }}"
          # a person approves each release signing in SignPath
          wait-for-completion-timeout-in-seconds: 3600
          # the workflow artifact is a zip around Forge's zip: extracting it leaves the signed Forge zip in signed/
          output-artifact-directory: signed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: signed/*.zip
          if-no-files-found: error

  release:
    needs: [build, sign]
    # Publishes the signed zip, or the unsigned one while signing is not set up; never after a failed signing.
    # !cancelled() is a status check, so a skipped sign does not skip this job.
    if: github.event_name == 'push' && !cancelled() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.sign.result == 'success' && 'signed' || 'unsigned' }}
          path: zip
      - run: gh release create "$GITHUB_REF_NAME" zip/*.zip --verify-tag --generate-notes --prerelease --notes "[Code signing policy](https://github.com/hpagniez/grace#code-signing-policy)"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
