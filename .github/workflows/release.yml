# Builds the Windows zip for a version tag and attaches it to a GitHub Release (ADR 0007).
# No tests here: the release or hotfix PR into main ran them.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # keep the write token out of .git/config while npm install scripts run; gh gets GH_TOKEN
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor
            !vendor/.download
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-vendor.mjs') }}
      - run: npm ci
      - run: npm run vendor
      - run: npm run make
      - run: gh release create "$GITHUB_REF_NAME" out/make/zip/win32/x64/*.zip --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
