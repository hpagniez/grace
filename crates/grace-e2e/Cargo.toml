[package]
name = "grace-e2e"
description = "End-to-end tests of GPUI Grace through the accessibility tree (migration guide R6.3)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "=0.29.0", default-features = false, features = [
  "proxies",
  "connection",
  "zbus",
] }
futures-lite = "=2.6.1"
# WM_DELETE_WINDOW for `Driver::close`: the version GPUI's X11 backend already brings
x11rb = "=0.13.2"

[target.'cfg(windows)'.dependencies]
uiautomation = "=0.25.1"
