[package]
name = "grace-e2e"
description = "End-to-end tests of GPUI Grace through the accessibility tree (migration guide R6.3)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1.0.154"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "=0.29.0", default-features = false, features = [
  "proxies",
  "connection",
  "zbus",
] }
futures-lite = "=2.6.1"
# WM_DELETE_WINDOW for `Driver::close`, XTest for F8: the version GPUI's X11 backend already brings
x11rb = { version = "=0.13.2", features = ["xtest"] }

[target.'cfg(windows)'.dependencies]
uiautomation = "=0.25.1"

[features]
# the screenshots for pull requests (`tests/screens.rs`): a capture, not a check, so the e2e suite leaves it out; on
# Linux, with ImageMagick's `import`. `scripts/e2e-gpui.sh` turns it on when `GRACE_SCREENS` is set
screens = []

[[test]]
name = "screens"
required-features = ["screens"]
