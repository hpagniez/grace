[package]
name = "grace-core"
description = "Everything of GPUI Grace without a window: the model, Karate, runs, settings (migration guide, Architecture)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The stored format of an encrypted secret (secrets.rs). Two versions are in the lock; this one is GPUI's (usvg).
base64 = "=0.22.1"
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# The project fingerprint (fingerprint.rs). The version GPUI Kit's rust-embed links; the other one is Linux-only.
sha2 = "=0.11.1"

# DPAPI for the current user: Windows' side of the secret box (secrets.rs, migration guide R5.3). The version GPUI's
# Windows backend links, so the exe gains no second copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3.27.0"
