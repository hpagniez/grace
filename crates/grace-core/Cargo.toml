[package]
name = "grace-core"
description = "Everything of GPUI Grace without a window: the model, Karate, runs, settings (migration guide, Architecture)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `clock` for `chrono::Local`: the history labels are in local time. The lock has chrono 0.4.45 through GPUI.
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# The stored format of an encrypted secret (secrets.rs). Two versions are in the lock; this one is GPUI's (usvg).
base64 = "=0.22.1"
indexmap = { version = "2.14.2", features = ["serde"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
# `preserve_order`: an object keeps its keys in the order of the text (an Examples table's columns), as a JavaScript object does.
serde_json = { version = "1.0.154", features = ["preserve_order"] }
# The project fingerprint (fingerprint.rs). The version GPUI Kit's rust-embed links; the other one is Linux-only.
sha2 = "=0.11.1"

# Windows' side of the platform seams (migration guide R5.3): DPAPI for the current user (secrets.rs); the job object,
# the priority class and a process's executable (karate/process.rs). The version GPUI's Windows backend links, so the
# exe gains no second copy.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# Linux's side of karate/process.rs: `setpriority` (nice 10) and `kill` of a process group, which std has no call for.
# The version already in the lock through GPUI: no new crate.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
