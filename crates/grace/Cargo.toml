[package]
name = "grace"
description = "Grace, the desktop runner for Karate, in Rust and GPUI (ADR 0031)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Built as Grace.exe, the name the updater's contract fixes (ADR 0019).
[[bin]]
name = "Grace"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
gpui-kit-assets.workspace = true
grace-core.workspace = true

# GPUI's platform crate picks its backend from the target: DirectX 11 on Windows, X11 on Linux. Only Linux has a
# feature to turn on.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["x11"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
gpui_platform.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
